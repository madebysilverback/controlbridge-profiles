name: Profile factory

on:
  schedule:
    - cron: "17 3 * * *"          # every night at 03:17 UTC
  workflow_dispatch:
    inputs:
      count:
        description: "How many new games to try"
        default: "20"

permissions:
  contents: write

concurrency:
  group: library-writes
  cancel-in-progress: false

jobs:
  make-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SteamCMD (reads game program names, no login)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1
          mkdir -p ~/steamcmd && cd ~/steamcmd
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxf -
          ./steamcmd.sh +quit || true

      - name: Refresh the list of games (Mondays, or if missing)
        run: |
          if [ ! -f factory/candidates.json ] || [ "$(date +%u)" = "1" ]; then
            python factory/candidates.py
          fi

      - name: Make profiles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python factory/run.py --count "${{ github.event.inputs.count || '20' }}"

      - name: Publish
        run: |
          git config user.name "ControlBridge factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library factory/state.json factory/candidates.json
          git diff --cached --quiet || git commit -m "Library: new game profiles $(date -u +%F)"
          git pull --rebase
          git push
